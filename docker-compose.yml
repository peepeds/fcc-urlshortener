version: '3.8'

services:
  app:
    image: peepeds/url-shortener:latest
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - BASE_URL=http://localhost:3000/
    networks:
      - url-shortener-network
  
volumes:
  mongo-data:
    driver: local

networks:
  url-shortener-network:
    driver: bridge
  